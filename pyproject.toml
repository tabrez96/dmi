[project]
name = "dmi-hq"
version = "0.1.0"
description = "Dunder Mifflin - an autonomous company of role agents, run by a human PM"
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.4",
    "pyyaml>=6",
]

[project.scripts]
dmi = "hq.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hq"]
